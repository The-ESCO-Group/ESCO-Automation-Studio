name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Type-check
        run: corepack pnpm -r typecheck

      - name: Unit tests
        run: corepack pnpm test

      - name: Build web app
        run: corepack pnpm build

# Browser E2E (pnpm e2e) is run locally: it needs a running dev server and
# Microsoft Edge (channel "msedge"), so it is not part of this headless CI job.
# See CONTRIBUTING.md for how to run it.
