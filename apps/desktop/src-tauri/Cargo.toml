[package]
name = "esco-automation-studio-desktop"
version = "0.0.1"
description = "ESCO Automation Studio Windows desktop shell"
authors = ["Scintilla ESCO Group"]
edition = "2021"

[lib]
name = "esco_automation_studio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = { version = "3", features = ["windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
rfd = "0.15"
